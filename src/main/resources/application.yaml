spring:
  application:
    name: schwab-agentic-url-shortener
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/url_shortener}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  short-url:
    code-length: ${SHORT_URL_CODE_LENGTH:8}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
